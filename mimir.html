<html class="staticrypt-html">

        <script>
            // scripts/theme.js stores the visitor's choice under "theme"; honour it
            // here so the gate isn't light while the site behind it is dark.
            try {
                var _t = localStorage.getItem("theme");
                if (_t === "dark" || _t === "light") {
                    document.documentElement.setAttribute("data-theme", _t);
                }
            } catch (e) { /* private mode: fall back to prefers-color-scheme */ }
        </script>

        <style>
            /* ============================================
               Password gate — same design language as the portfolio.
               Tokens copied from styles/main.css rather than linked: this page
               is the thing standing between a visitor and the site, so it must
               render correctly with no external stylesheet.
               ============================================ */
            :root {
                --color-bg: #f8f9fc;
                --color-text: #1a1a2e;
                --color-text-secondary: #5a5a6a;
                --color-accent: #6366f1;
                --color-accent-dark: #4f46e5;
                --color-border: rgba(0, 0, 0, 0.08);
                --grad-start: rgba(200, 180, 240, 0.30);
                --grad-end: rgba(240, 245, 255, 1);
                --glass-bg: rgba(255, 255, 255, 0.55);
                --glass-border: rgba(255, 255, 255, 0.35);
                --shadow-card: 0 4px 24px rgba(100, 100, 140, 0.12);
                --field-bg: rgba(255, 255, 255, 0.75);
                --on-accent: #ffffff;
            }

            [data-theme="dark"] {
                --color-bg: #0f0f14;
                --color-text: #f0f0f5;
                --color-text-secondary: #a0a0b0;
                --color-accent: #818cf8;
                --color-accent-dark: #6366f1;
                --color-border: rgba(255, 255, 255, 0.08);
                --grad-start: rgba(40, 20, 60, 0.5);
                --grad-end: rgba(10, 10, 15, 1);
                --glass-bg: rgba(255, 255, 255, 0.07);
                --glass-border: rgba(255, 255, 255, 0.12);
                --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.4);
                --field-bg: rgba(255, 255, 255, 0.06);
                --on-accent: #0f0f14;
            }

            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    --color-bg: #0f0f14;
                    --color-text: #f0f0f5;
                    --color-text-secondary: #a0a0b0;
                    --color-accent: #818cf8;
                    --color-accent-dark: #6366f1;
                    --color-border: rgba(255, 255, 255, 0.08);
                    --grad-start: rgba(40, 20, 60, 0.5);
                    --grad-end: rgba(10, 10, 15, 1);
                    --glass-bg: rgba(255, 255, 255, 0.07);
                    --glass-border: rgba(255, 255, 255, 0.12);
                    --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.4);
                    --field-bg: rgba(255, 255, 255, 0.06);
                    --on-accent: #0f0f14;
                }
            }

            * { box-sizing: border-box; }

            html, body { height: 100%; }

            .staticrypt-body {
                margin: 0;
                min-height: 100%;
                padding: 24px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                color: var(--color-text);
                background:
                    radial-gradient(ellipse 80% 60% at 50% 0%, var(--grad-start) 0%, var(--grad-end) 100%),
                    var(--color-bg);
                -webkit-font-smoothing: antialiased;
            }

            .hidden { display: none !important; }

            /* Loading spinner, in the accent rather than the stock green */
            .staticrypt-spinner-container {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
            }
            .staticrypt-spinner {
                width: 34px;
                height: 34px;
                border: 3px solid var(--color-border);
                border-top-color: var(--color-accent);
                border-radius: 50%;
                animation: staticrypt-spin 0.8s linear infinite;
            }
            @keyframes staticrypt-spin { to { transform: rotate(360deg); } }

            .staticrypt-page { width: 100%; }

            .staticrypt-form {
                width: 100%;
                max-width: 440px;
                margin: 0 auto;
                padding: 40px;
                border-radius: 24px;
                background: var(--glass-bg);
                border: 1px solid var(--glass-border);
                box-shadow: var(--shadow-card);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                animation: staticrypt-rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            @keyframes staticrypt-rise {
                from { opacity: 0; transform: translateY(12px); }
                to   { opacity: 1; transform: none; }
            }

            .staticrypt-mark {
                width: 36px;
                height: 36px;
                display: block;
                margin-bottom: 22px;
                border-radius: 12px;
            }

            .staticrypt-instructions { margin-bottom: 26px; }

            .staticrypt-title {
                margin: 0 0 10px;
                font-size: 24px;
                font-weight: 700;
                letter-spacing: -0.02em;
                line-height: 1.2;
            }

            .staticrypt-instructions p:not(.staticrypt-title) {
                margin: 0;
                font-size: 14px;
                line-height: 1.6;
                color: var(--color-text-secondary);
            }

            /* The stock template rules a line under the heading; the portfolio
               separates with space, so this stays out of the way. */
            .staticrypt-hr { display: none; }

            .staticrypt-password-container {
                position: relative;
                display: flex;
                align-items: center;
                margin-bottom: 14px;
            }

            #staticrypt-password {
                width: 100%;
                padding: 13px 46px 13px 16px;
                font-family: inherit;
                font-size: 15px;
                color: var(--color-text);
                background: var(--field-bg);
                border: 1px solid var(--color-border);
                border-radius: 12px;
                transition: border-color 0.18s ease, box-shadow 0.18s ease;
            }
            #staticrypt-password::placeholder { color: var(--color-text-secondary); opacity: 0.8; }
            #staticrypt-password:focus {
                outline: none;
                border-color: var(--color-accent);
                box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-accent) 22%, transparent);
            }

            .staticrypt-toggle-password-visibility {
                position: absolute;
                right: 14px;
                width: 19px;
                height: 19px;
                cursor: pointer;
                opacity: 0.5;
                transition: opacity 0.18s ease;
            }
            .staticrypt-toggle-password-visibility:hover { opacity: 0.9; }
            [data-theme="dark"] .staticrypt-toggle-password-visibility { filter: invert(1); }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) .staticrypt-toggle-password-visibility { filter: invert(1); }
            }

            /* Remember-me is forced on and never shown. */
            label.staticrypt-remember { display: none !important; }

            .staticrypt-decrypt-button {
                width: 100%;
                padding: 13px 20px;
                font-family: inherit;
                font-size: 15px;
                font-weight: 600;
                color: var(--on-accent);
                background: var(--color-accent);
                border: none;
                border-radius: 100px;
                cursor: pointer;
                transition: background 0.18s ease, transform 0.18s ease;
            }
            .staticrypt-decrypt-button:hover { background: var(--color-accent-dark); }
            .staticrypt-decrypt-button:active { transform: translateY(1px); }
            .staticrypt-decrypt-button:focus-visible {
                outline: 2px solid var(--color-accent);
                outline-offset: 3px;
            }

            /* Unlock: the frosted panel clears and lifts, then the real page
               fades in underneath. Staticrypt replaces the whole document, so
               the continuity comes from replaceHtmlCallback below holding the
               write back until this has played. */
            .staticrypt-unlocking .staticrypt-form {
                animation: staticrypt-clear 420ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }
            .staticrypt-unlocking .staticrypt-mark {
                animation: staticrypt-mark-pop 420ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }
            @keyframes staticrypt-clear {
                from { opacity: 1; transform: scale(1); }
                to   { opacity: 0; transform: scale(1.03); backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); }
            }
            @keyframes staticrypt-mark-pop {
                40%  { transform: scale(1.12); }
                to   { transform: scale(0.96); opacity: 0; }
            }

            @media (max-width: 480px) {
                .staticrypt-body { padding: 16px; }
                .staticrypt-form { padding: 28px 22px; border-radius: 20px; }
                .staticrypt-title { font-size: 21px; }
            }

            @media (prefers-reduced-motion: reduce) {
                .staticrypt-form { animation: none; }
                .staticrypt-unlocking .staticrypt-form,
                .staticrypt-unlocking .staticrypt-mark { animation: none; opacity: 0; }
                .staticrypt-spinner { animation-duration: 2s; }
                .staticrypt-decrypt-button, #staticrypt-password { transition: none; }
            }
        </style>
    </head>
